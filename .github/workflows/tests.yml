name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt coverage

      # `-m "not timing"`: the timing assertions guard the measurement claims, but a
      # shared CI runner can stall a process mid-window and fail them for reasons that
      # have nothing to do with the code. They run locally, on the quiet machine that
      # produces the results. Deselecting them here is a statement about the runner,
      # not a licence to let them rot -- `make check` runs the full suite.
      # `-rs` prints the reason for every skip. The end-to-end tests need the
      # `feasible-rerank` checkout, which is private and cannot be cloned here, so this
      # job is deliberately running a smaller suite than the development machine does.
      # A green tick over an unstated subset is how coverage quietly disappears, so the
      # log states it every run.
      - run: coverage run -m pytest tests/ -m "not timing" -rs
      - run: coverage report

      # Guards the guard. Exactly two things are legitimately unavailable here: the
      # private companion checkout, and torch (a ~2.5 GB optional extra). Any other
      # skip -- a broken import, a marker typo, a dependency that quietly vanished --
      # would otherwise shrink the suite while CI stayed green, which is the failure
      # mode this whole project is about.
      - name: assert every skip has an expected reason
        run: |
          python -m pytest tests/ -m "not timing" -rs -q 2>&1 | tee pytest.log
          if grep -E '^SKIPPED' pytest.log \
             | grep -vE 'feasible-rerank checkout|torch is an optional extra'; then
            echo "::error::a test was skipped for an unexpected reason (see above)"
            exit 1
          fi
          echo "all skips accounted for"

      # The harness must import and measure (in wall-clock-only mode) with no energy
      # backend installed. CI has none, so the run above already proves it; this asserts
      # it deliberately rather than by accident.
      - run: python -c "from green_rerank.measure import default_meter; print(default_meter())"

  mutations:
    # The check on the checks. Coverage says a line ran; this says that breaking it
    # fails something. Runs once rather than across the matrix -- the mutations are
    # about the code's invariants, not about a Python version.
    #
    # Only the mutations whose tests do not need the companion checkout, since it is
    # private and cannot be cloned here. The rest run on the development machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: list the mutations
        run: python tests/mutations.py --list
      - name: analysis and measurement invariants
        run: |
          for area in crossover bootstrap retraining domination agreement \
                      throttling power-source below-quantum probe; do
            python tests/mutations.py --filter "$area"
          done
