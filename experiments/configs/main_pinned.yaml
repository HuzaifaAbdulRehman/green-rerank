# The primary sweep with BLAS thread count pinned to one.
#
# Every experimental parameter is identical to main_v2.yaml. The only difference is
# outside the config: the sweep is launched with
#
#     OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
#
# This exists to test report §7.1's diagnosis, which is currently an explanation with no
# demonstration behind it. §7.1 attributes the ItemKNN-against-ALS break-even's 123x
# confidence interval to a property of the cost unit: CPU-seconds counts every thread,
# BLAS re-decides its thread count per process, and ALS's retrieve_score therefore ran at
# utilisations of 2.47, 2.02, 1.44, 1.61 and 1.38 across five repeats of identical work
# while ItemKNN's, single-threaded, held at 1.00, 0.98, 0.99, 0.98 and 1.01. The variance
# that induces in ALS alone is larger than the difference between the two families, so the
# denominator of the crossover changed sign in one repeat of five.
#
# The predictions below are recorded here rather than written up afterwards, because the
# manifest is built before the first cell runs. The whole config is embedded in
# manifest.json, so these are stamped into the run's own provenance record and cannot be
# revised once the answer is known. Deciding afterwards which outcome was expected is the
# single-draw error §7.1 is about, turned on the author.
name: main_pinned

prediction:
  registered_before_run: true
  mechanism_under_test: >
    ALS's per-request cost in CPU-seconds inherits BLAS's runtime thread-count decision.
    Pinning the thread count removes that source of variance from the crossover's
    denominator.

  # Stated as falsifiable thresholds, not directions.
  expected:
    als_retrieve_score_utilisation: >
      collapses to approximately 1.0 on every repeat, with a max-min spread below 0.10.
      Baseline spread in main_v2 is 1.09 (1.38 to 2.47).
    itemknn_retrieve_score_utilisation: >
      unchanged at approximately 1.0. It was already single-threaded, so a change here
      would mean the pinning did something other than what is claimed.
    denominator_sign: >
      single-signed across all five repeats. In main_v2 it read -3.16e-05, +3.80e-07,
      +3.68e-05, +3.26e-05, +3.88e-05 -- one sign flip in five.
    itemknn_vs_als_ci_ratio: >
      falls below the 10x stability threshold. Point prediction 5x or tighter, against
      123x in main_v2.
    is_stable_verdict: >
      the pair passes all three conjuncts (crossing >= 0.9, CI ratio < 10x, repeats >= 3)
      and becomes reportable.

  # What would show the diagnosis is wrong. Written down so the result can contradict it.
  falsified_if: >
    ALS's utilisation collapses as predicted AND the CI ratio stays above 10x. That would
    mean thread-count variance was not what made the pair unidentifiable, and §7.1's
    mechanism is wrong or incomplete. This is the more interesting outcome and is to be
    reported as such, not softened into "partially improved".

  # Not predicted, and not to be presented as a success or failure either way.
  not_predicted: >
    The value of N itself, and whether the two lines cross at all. Pinning threads lowers
    ALS's measured per-request CPU-seconds toward its true single-thread cost, which
    changes the denominator's magnitude as well as its stability. The lines may cross at a
    materially different volume, or one family may dominate at every volume and the
    crossing cease to exist. Domination is a legitimate finding, not a failed run.
    Absolute costs in this directory are NOT comparable to main_v2 for any purpose other
    than variance: single-threaded wall-clock is longer and CPU-seconds lower by
    construction.

catalogues: [gift_cards, software, ml100k, luxury_beauty, digital_music]
families: [popularity, itemknn, als, multvae, gru4rec]
only_on:
  multvae: [ml100k]
  gru4rec: [ml100k]
rerankers: [null, quota_mmr]
n_users: 200
n_candidates: 200
k: 10
repeats: 5
seed: 0
lam: 0.3
mu: 1.0
family_kwargs:
  als:
    epochs: 15
  multvae:
    epochs: 10
  gru4rec:
    epochs: 5
