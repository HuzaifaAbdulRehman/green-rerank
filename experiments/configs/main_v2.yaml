# Regeneration of the primary sweep against the corrected companion.
#
# Identical to main.yaml in every experimental parameter. It exists as a separate
# config, writing to a separate results directory, because the numbers it produces are
# not comparable to results/main: that sweep ran against a companion whose `binary=True`
# summed duplicate interactions, so 0.2-18.1 % of training rows on the Amazon
# catalogues were counts rather than indicators, and the popularity tiers used as
# fairness groups counted repeat purchases. MovieLens 100K has zero duplicates and is
# unaffected.
#
# The old directory is kept as historical evidence rather than overwritten.
name: main_v2
catalogues: [gift_cards, software, ml100k, luxury_beauty, digital_music]
families: [popularity, itemknn, als, multvae, gru4rec]
only_on:
  multvae: [ml100k]
  gru4rec: [ml100k]
rerankers: [null, quota_mmr]
n_users: 200
n_candidates: 200
k: 10
repeats: 5
seed: 0
lam: 0.3
mu: 1.0
family_kwargs:
  als:
    epochs: 15
  multvae:
    epochs: 10
  gru4rec:
    epochs: 5
